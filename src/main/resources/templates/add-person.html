<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>افزودن شخص</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
        background-color: #f4f7fa;
        font-family: 'Arial', sans-serif;
    }
    .form-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        margin-top: 50px;
    }
    .error-message {
        color: red;
        margin-top: 10px;
        text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 form-container">
      <h2 class="text-center">افزودن شخص جدید</h2>
      <!-- پیام خطا -->
      <div id="errorMessage" class="error-message" style="display: none;"></div>
      <form id="addPersonForm">
        <div class="form-group">
          <label for="name">نام:</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="familyName">نام خانوادگی:</label>
          <input type="text" class="form-control" id="familyName" name="familyName" required>
        </div>
        <div class="form-group">
          <label for="phone">تلفن:</label>
          <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="form-group">
          <label for="nationalNumber">کد ملی:</label>
          <input type="text" class="form-control" id="nationalNumber" name="nationalNumber" required>
        </div>
        <div class="form-group">
          <label for="homePhone">تلفن منزل:</label>
          <input type="text" class="form-control" id="homePhone" name="homePhone">
        </div>
        <div class="form-group">
          <label for="gender">جنسیت:</label>
          <select class="form-control" id="gender" name="gender" required>
            <option value="1">مرد</option>
            <option value="2">زن</option>
          </select>
        </div>
        <div class="form-group">
          <label for="personType">نوع شخص:</label>
          <select class="form-control" id="personType" name="personType" required>
            <option value="4">حسابدار</option>
            <option value="2">مشتری</option>
            <option value="3">خریدار</option>
          </select>
        </div>
        <!-- افزودن فیلد accountHeadingDetail -->
        <div class="form-group">
          <label for="accountHeadingDetail">سرفصل تفصیل:</label>
          <select class="form-control" id="accountHeadingDetail" name="accountHeadingDetail" required>
            <option value="1">سرفصل ۱</option>
            <option value="2">سرفصل ۲</option>
            <option value="3">سرفصل ۳</option>
          </select>
        </div>
        <!-- افزودن فیلد fiscalYear -->
        <div class="form-group">
          <label for="fiscalYear">سال مالی:</label>
          <select class="form-control" id="fiscalYear" name="fiscalYear" required>
            <option value="1">سال مالی ۱</option>
            <option value="2">سال مالی ۲</option>
            <option value="3">سال مالی ۳</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success btn-block">ذخیره</button>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
  $(document).ready(function() {
    $('#addPersonForm').on('submit', function(event) {
      event.preventDefault();

      $('#errorMessage').hide();

      const formData = {
        name: $('#name').val(),
        familyName: $('#familyName').val(),
        phone: $('#phone').val(),
        nationalNumber: $('#nationalNumber').val(),
        homePhone: $('#homePhone').val(),
        gender: { id: $('#gender').val() },
        personType: { id: $('#personType').val() },
        accountHeadingDetail: { id: $('#accountHeadingDetail').val() },
        fiscalYear: { id: $('#fiscalYear').val() }
      };

      // ارسال درخواست به سرور
      $.ajax({
        url: '/api/persons',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function(response) {
          alert('شخص با موفقیت اضافه شد!');
          window.location.href = '/persons';
        },
        error: function(xhr) {

          let errorMessage = 'خطا در افزودن شخص. لطفاً دوباره تلاش کنید.';
          if (xhr.responseJSON && xhr.responseJSON.message) {
            errorMessage = xhr.responseJSON.message;
          }
          $('#errorMessage').text(errorMessage).show();
        }
      });
    });
  });
</script>
</body>
</html>
